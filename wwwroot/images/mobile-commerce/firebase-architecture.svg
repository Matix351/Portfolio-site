<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Mobile commerce Firebase architecture</title>
  <desc id="desc">Customer and shop owner Android applications each use Kotlin data-access code to communicate with Firebase Authentication, Cloud Firestore, and Firebase Storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161816"/>
      <stop offset="1" stop-color="#0d0f0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0878"/>
      <stop offset="1" stop-color="#ff4b2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#4d5649" stroke-width="3">
    <path d="M330 190 H390 V265 H455"/>
    <path d="M330 430 H390 V355 H455"/>
    <path d="M745 310 H858"/>
    <path d="M858 310 V135 H900"/>
    <path d="M858 310 H900"/>
    <path d="M858 310 V485 H900"/>
  </g>
  <g fill="#a8ff69">
    <circle cx="390" cy="190" r="6"/><circle cx="390" cy="430" r="6"/><circle cx="858" cy="310" r="6"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="95" width="260" height="190" rx="20" fill="#20241f" stroke="#3a4237"/>
    <rect x="70" y="335" width="260" height="190" rx="20" fill="#20241f" stroke="#3a4237"/>
    <rect x="455" y="205" width="290" height="210" rx="24" fill="url(#accent)"/>
    <rect x="900" y="55" width="235" height="160" rx="20" fill="#20241f" stroke="#3a4237"/>
    <rect x="900" y="230" width="235" height="160" rx="20" fill="#20241f" stroke="#3a4237"/>
    <rect x="900" y="405" width="235" height="160" rx="20" fill="#20241f" stroke="#3a4237"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g fill="#f7f9f3">
      <text x="100" y="145" font-size="18" font-weight="700">CUSTOMER APP</text>
      <text x="100" y="181" font-size="14" fill="#b0b8aa">Browse products</text>
      <text x="100" y="208" font-size="14" fill="#b0b8aa">Cart and checkout</text>
      <text x="100" y="235" font-size="14" fill="#b0b8aa">Addresses and orders</text>
      <text x="100" y="385" font-size="18" font-weight="700">SHOP OWNER APP</text>
      <text x="100" y="421" font-size="14" fill="#b0b8aa">Publish products</text>
      <text x="100" y="448" font-size="14" fill="#b0b8aa">Delete products</text>
      <text x="100" y="475" font-size="14" fill="#b0b8aa">Update order status</text>
      <text x="600" y="275" text-anchor="middle" font-size="20" font-weight="800">KOTLIN DATA ACCESS</text>
      <text x="600" y="303" text-anchor="middle" font-size="16" font-weight="700">IN EACH APP</text>
      <text x="600" y="343" text-anchor="middle" font-size="14">FireStoreClass</text>
      <text x="600" y="368" text-anchor="middle" font-size="14">Firestore calls and uploads</text>
      <text x="930" y="105" font-size="18" font-weight="700">AUTH</text>
      <text x="930" y="139" font-size="14" fill="#b0b8aa">Accounts</text>
      <text x="930" y="165" font-size="14" fill="#b0b8aa">Password reset</text>
      <text x="930" y="280" font-size="18" font-weight="700">CLOUD FIRESTORE</text>
      <text x="930" y="314" font-size="14" fill="#b0b8aa">Products and carts</text>
      <text x="930" y="340" font-size="14" fill="#b0b8aa">Users and orders</text>
      <text x="930" y="455" font-size="18" font-weight="700">STORAGE</text>
      <text x="930" y="489" font-size="14" fill="#b0b8aa">Product images</text>
      <text x="930" y="515" font-size="14" fill="#b0b8aa">Profile photos</text>
    </g>
    <text x="70" y="580" fill="#788272" font-size="13" letter-spacing="2">ANDROID · KOTLIN · FIREBASE</text>
  </g>
</svg>
