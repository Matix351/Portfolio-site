<title id="title">SmartBot system overview</title><desc id="desc">Sensors connect to ESP32-C3 via I2C; PWM controls motors. WSS SignalR connects the robot and server. The hub feeds visualizations, SQL telemetry storage, and an authenticated Blazor dashboard.</desc>
